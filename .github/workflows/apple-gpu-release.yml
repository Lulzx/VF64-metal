name: Apple GPU release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - generation: m1
            runner: apple-gpu-m1
          - generation: m2
            runner: apple-gpu-m2
          - generation: m3
            runner: apple-gpu-m3
          - generation: m4
            runner: apple-gpu-m4
    runs-on: [self-hosted, macOS, ARM64, "${{ matrix.runner }}"]
    timeout-minutes: 240
    steps:
      - name: Check out VF64-metal
        uses: actions/checkout@v4
      - name: Check out pinned CuMetal integration target
        uses: actions/checkout@v4
        with:
          repository: Lulzx/cuda-metal
          ref: 15e0bb2812bc4e29adca3bf54ca9c0f5d1c122c9
          path: cumetal
          submodules: recursive
      - name: Verify VF64 release gates
        shell: bash
        run: |
          set -o pipefail
          scripts/verify-release.sh 2>&1 | tee release-verification.log
      - name: Verify CuMetal source integration
        shell: bash
        env:
          CUMETAL_ROOT: ${{ github.workspace }}/cumetal
          CUMETAL_BUILD_DIR: ${{ github.workspace }}/cumetal/build-vf64-release
        run: |
          set -o pipefail
          scripts/check-cumetal-integration.sh 2>&1 | tee cumetal-integration.log
      - name: Capture device evidence manifest
        run: |
          scripts/capture-device-evidence.sh \
            "evidence/apple-${{ matrix.generation }}" \
            "${{ matrix.generation }}" \
            release-verification.log \
            cumetal-integration.log \
            15e0bb2812bc4e29adca3bf54ca9c0f5d1c122c9
      - name: Preserve device evidence
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.generation }}-release-verification
          path: evidence/apple-${{ matrix.generation }}
          if-no-files-found: error

  aggregate:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out VF64-metal
        uses: actions/checkout@v4
      - name: Download device evidence
        uses: actions/download-artifact@v4
        with:
          pattern: apple-*-release-verification
          path: evidence
      - name: Verify cross-generation evidence
        shell: bash
        run: |
          mapfile -d '' manifests < <(find evidence -name device-manifest.json -print0)
          scripts/check-cross-generation-evidence.sh \
            --require=m1,m2,m3,m4 "${manifests[@]}" \
            | tee cross-generation-summary.json
      - name: Preserve aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: apple-cross-generation-release-summary
          path: cross-generation-summary.json
          if-no-files-found: error
